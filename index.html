<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>하모니렌트카 · 자체상품 비교견적</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
--bg:#F8FAFC;--card:#FFFFFF;
--primary:#1E40AF;--primary-hover:#1D4ED8;
--accent:#4F46E5;--accent-subtle:#EEF2FF;
--text-main:#0F172A;--text-sub:#475569;--text-muted:#94A3B8;
--border:#E2E8F0;--border-focus:#3B82F6;
--good:#0F766E;--good-subtle:#ECFDF5;--gold:#B45309;--gold-subtle:#FFFBEB;
--sh-sm:0 1px 2px rgb(0 0 0 / .04);
--sh:0 4px 6px -1px rgb(0 0 0 / .05),0 2px 4px -2px rgb(0 0 0 / .05);
--sh-lg:0 12px 24px -6px rgb(0 0 0 / .12),0 4px 8px -4px rgb(0 0 0 / .06);
--r:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,system-ui,"맑은 고딕","Malgun Gothic",sans-serif;
  background:var(--bg);color:var(--text-main);font-size:14px;line-height:1.6;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header.top{background:#fff;border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30}
header.top .logo{height:32px;width:auto;display:block}
header.top b{font-size:18px;font-weight:800;letter-spacing:-.02em}
header.top .sp{font-size:12.5px;color:var(--text-muted)}
header.top .inq{margin-left:auto;border:1.5px solid var(--primary);background:#fff;color:var(--primary);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s}
header.top .inq:hover{background:var(--accent-subtle)}
header.top .inqtext{margin-left:auto;font-size:12.5px;color:var(--text-sub);font-weight:600}
header.top .inqtext + .inq{margin-left:10px}
header.top .promo-top{margin-left:auto;border:0;background:linear-gradient(135deg,#EC4899,#DB2777);color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;box-shadow:0 2px 8px rgba(219,39,119,.28)}
header.top .promo-top:hover{filter:brightness(1.05)}
header.top .promo-top + .inqtext{margin-left:14px}
.promolist{display:flex;flex-direction:column;gap:12px;max-height:62vh;overflow:auto}
.promoitem{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:#fff}
.promoitem .pi-t{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.promoitem .pi-k{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;background:#FCE7F3;color:#BE185D}
.promoitem .pi-k.series{background:#DBEAFE;color:#1D4ED8}
.promoitem .pi-m{font-size:12.5px;color:var(--text-sub);margin-top:6px;line-height:1.5}
.promoitem .pi-d{font-size:11.5px;color:var(--text-muted);margin-top:4px}
.fhead-r{display:flex;align-items:center;gap:10px}
.freset{border:none;background:transparent;color:var(--text-muted);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:2px;display:flex;align-items:center;gap:3px}
.freset:hover{color:var(--primary)}
.freset .ri{font-size:14px}
.promobtn{border:1.5px solid #F9A8D4;background:#FDF2F8;color:#BE185D;border-radius:11px;padding:11px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;width:100%}
.promobtn:hover{background:#FCE7F3}
.promobtn.on{background:#BE185D;color:#fff;border-color:#BE185D}
.wrap{display:grid;grid-template-columns:260px 360px 1fr;grid-template-areas:"f match main";gap:18px;padding:20px;max-width:1620px;margin:0 auto;align-items:start}
.filters{grid-area:f}.matchbar{grid-area:match}main{grid-area:main}
@media(max-width:1180px){.wrap{grid-template-columns:250px 1fr;grid-template-areas:"f match" "f main"}}
.filters{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-sm);position:sticky;top:80px;overflow:hidden}
.fhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px}
.fhead h3{margin:0;font-size:15px;font-weight:800}
.ftoggle{display:none;border:1px solid var(--border);background:#fff;border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--text-sub);cursor:pointer}
.fbody{padding:0 20px 20px;display:flex;flex-direction:column;gap:16px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:7px}
.fld select,.fld input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;background:#fff;color:var(--text-main);transition:.15s;font-family:inherit}
.fld input:focus{outline:none;border-color:var(--border-focus);box-shadow:0 0 0 3px rgb(59 130 246 / .12)}
.budgetfld{background:var(--accent-subtle);border:1px solid #E0E7FF;border-radius:12px;padding:14px}
.budgetfld label{color:var(--accent)}
.budgetfld input{font-weight:800;font-size:16px;color:var(--accent);text-align:right}
.bhint{font-size:11px;color:var(--text-muted);margin-top:6px}
.seg{display:flex;gap:6px;background:#F1F5F9;padding:4px;border-radius:11px}
.seg button{flex:1;padding:9px 6px;border:none;background:transparent;border-radius:8px;font-size:12.5px;line-height:1.25;font-weight:700;color:var(--text-sub);cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap;min-width:0}
.seg button.on{background:#fff;color:var(--primary);box-shadow:var(--sh-sm)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:8px 13px;border:1px solid var(--border);background:#fff;border-radius:20px;font-size:12px;font-weight:700;color:var(--text-sub);cursor:pointer;transition:.15s;font-family:inherit}
.chips button:hover{border-color:var(--border-focus)}
.chips button.on{background:var(--accent-subtle);color:var(--accent);border-color:var(--accent)}
.gho{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12.5px;font-weight:700;color:var(--text-sub);cursor:pointer;width:100%;transition:.15s}
.gho:hover{background:#F8FAFC;border-color:var(--border-focus)}
main{min-height:400px;display:flex;flex-direction:column;gap:18px}
.matchbar{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-sm);padding:16px 18px;position:sticky;top:80px;align-self:start}
.matchcnt{font-size:13px;color:var(--text-sub);font-weight:600}
.matchcnt b{color:var(--primary);font-size:16px;font-weight:800}
.stocklist{display:flex;flex-direction:column;max-height:calc(100vh - 190px);overflow:auto;margin-top:12px;border:1px solid var(--border);border-radius:12px}
.scard{display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;background:#fff;transition:.12s}
.scard:last-child{border-bottom:none}
.scard:hover{background:var(--accent-subtle)}
.scard.sel{background:var(--accent-subtle);box-shadow:inset 3px 0 0 var(--primary)}
.scard .sc-l{min-width:0}
.scard .snm{font-weight:800;font-size:13.5px;line-height:1.45;word-break:keep-all}
.scard .smeta{font-size:11.5px;color:var(--text-muted);margin-top:3px;line-height:1.55;word-break:keep-all}
.scard .stags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
.scard .stag{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;background:#F1F5F9;color:var(--text-sub);white-space:nowrap}
.scard .stag.hot{background:var(--gold-subtle);color:var(--gold)}
.scard .stag.promo{background:#FCE7F3;color:#BE185D}
.empty{background:var(--card);border:1px dashed var(--border);border-radius:var(--r);padding:56px 20px;text-align:center;color:var(--text-muted)}
.empty .inqlink{color:var(--primary);font-weight:800;cursor:pointer;text-decoration:underline}
.empty .switchbtn{margin-top:14px;border:0;background:var(--primary);color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.hero{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px}
.hero .vname{font-size:20px;font-weight:800;margin-bottom:4px}
.hero .vtags{display:flex;gap:6px;margin-bottom:4px}
.hero .vtags .vt{font-size:11px;font-weight:800;padding:3px 10px;border-radius:7px;background:var(--accent-subtle);color:var(--accent)}
.hero .vtags .vt.lease{background:#F3E8FF;color:#7E22CE}
.hero .vsub{font-size:12.5px;color:var(--text-muted);margin-bottom:16px}
.hero .promoline{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.hero .promoline .pbadge{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:8px;background:#FCE7F3;color:#BE185D}
.vinfo{margin-top:16px;border-top:1px solid var(--border);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.vi-row{display:flex;gap:10px;align-items:flex-start}
.vi-k{font-size:11.5px;font-weight:700;color:var(--text-muted);width:64px;flex:0 0 64px;padding-top:3px}
.vi-v{display:flex;flex-wrap:wrap;gap:6px}
.colchip{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:#F1F5F9;color:var(--text-sub)}
.optchip{font-size:11.5px;padding:4px 10px;border-radius:8px;background:#F8FAFC;border:1px solid var(--border);color:var(--text-sub)}
.herobar{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:16px}
.hblock{background:#F8FAFC;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.hblock .hl{font-size:11.5px;font-weight:700;color:var(--text-muted);margin-bottom:8px}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.sumrow .k{font-size:12px;color:var(--text-sub)}
.sumrow .v{font-size:14px;font-weight:800}
.sumrow.big .v{font-size:17px;color:var(--primary)}
.pillrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pillrow:last-child{margin-bottom:0}
.pillrow .pl{font-size:12px;font-weight:700;color:var(--text-sub);width:52px;flex:0 0 52px}
.pills{display:flex;gap:6px;flex:1}
.pills button{flex:1;padding:8px 0;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--text-sub);cursor:pointer;transition:.15s;font-family:inherit}
.pills button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.hblock .hint{font-size:10.5px;color:var(--text-muted);margin-top:8px;line-height:1.5}
.hblock select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-weight:700;background:#fff;color:var(--text-main);font-family:inherit}
.recbanner{background:linear-gradient(90deg,var(--primary),var(--accent));color:#fff;border-radius:12px;padding:13px 18px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:var(--sh)}
.recbanner .big{font-size:16px;font-weight:800}
.recbanner.soft{background:#F1F5F9;color:var(--text-sub);box-shadow:none}
.pgroup>h4{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:9px}
.pgroup>h4 .b{font-size:11px;font-weight:800;padding:3px 10px;border-radius:7px}
.b.rent{background:var(--accent-subtle);color:var(--accent)}
.b.lease{background:#F3E8FF;color:#7E22CE}
.pgrid{display:flex;flex-wrap:nowrap;gap:16px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.pgrid>.pcard{flex:0 0 300px;scroll-snap-align:start}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--sh-sm);transition:transform .18s ease,box-shadow .18s ease;position:relative;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.pcard.fit{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,var(--primary),var(--accent)) border-box;border:1.5px solid transparent;box-shadow:var(--sh)}
.pcard.hi{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#7E22CE,var(--accent)) border-box;border:1.5px solid transparent;box-shadow:var(--sh)}
.pchead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.pcard .pt{font-size:16px;font-weight:800}
.hbadge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;background:#F1F5F9;color:var(--text-sub)}
.hbadge.best{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.hbadge.owner{background:var(--gold-subtle);color:var(--gold)}
.hbadge.hi{background:linear-gradient(135deg,#7E22CE,var(--accent));color:#fff}
.pcard .pd{font-size:12px;color:var(--text-muted);margin:2px 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tags .t{font-size:11px;font-weight:700;color:var(--text-sub);background:#F1F5F9;border-radius:7px;padding:4px 9px}
.tags .t.lease{background:#FAF5FF;color:#7E22CE}
.price{margin-bottom:6px}
.price .amt{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--primary)}
.pcard.buy .price .amt{color:var(--accent)}
.price .amt .u{font-size:15px;font-weight:700;color:var(--text-sub);margin-left:1px}
.price .per{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.dep{font-size:11.5px;color:var(--text-sub);margin:8px 0 2px}
.dep b{color:var(--text-main)}
.dep2{font-size:11.5px;font-weight:700;color:var(--accent);background:#FAF9FF;border:1px solid #EDE9FE;border-radius:8px;padding:6px 10px;margin:4px 0}
.save{font-size:12px;font-weight:800;color:var(--good);background:var(--good-subtle);border-radius:8px;padding:6px 10px;margin:8px 0 4px;display:inline-block}
.cardpills{background:#FAF9FF;border:1px solid #EDE9FE;border-radius:10px;padding:10px 12px;margin:6px 0 4px;display:flex;flex-direction:column;gap:8px}
.cardpills .cprow{display:flex;align-items:center;gap:8px}
.cardpills .cpl{font-size:11.5px;font-weight:700;color:var(--text-sub);width:44px;flex:0 0 44px}
.cardpills .cp{display:flex;gap:5px;flex:1}
.cardpills .cp button{flex:1;padding:6px 0;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:11.5px;font-weight:800;color:var(--text-sub);cursor:pointer;font-family:inherit;transition:.12s}
.cardpills .cp button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cardpills .cp button.lock{background:#F1F5F9;color:#94A3B8;border-color:#E2E8F0;cursor:default}
.cardpills .cp button.lock.on{background:var(--accent);color:#fff;border-color:var(--accent);opacity:.92}
.cardpills .cp button.block{background:#fff;color:#CBD5E1;border-color:#EEF2F7;cursor:not-allowed}
.cardpills .cphint{font-size:10.5px;font-weight:700;color:var(--text-sub);white-space:nowrap;align-self:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;font-size:12.5px;font-weight:600;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.22s;z-index:9999;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hb2{grid-template-columns:1fr 1fr !important}
.termsel{margin:10px 0 14px}
.termsel select{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:11px;font-size:13px;font-weight:700;color:var(--text-main);background:#F8FAFC;cursor:pointer;font-family:inherit}
.cta{width:100%;padding:13px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:13.5px;font-weight:800;cursor:pointer;transition:.15s;font-family:inherit;margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px}
.cta:hover{background:var(--primary-hover)}
.cta.owner{background:#fff;color:var(--gold);border:1.5px solid #FDE68A}
.cta.owner:hover{background:var(--gold-subtle)}
.note{font-size:11.5px;color:var(--text-muted);margin-top:4px;line-height:1.6}
.modal{position:fixed;inset:0;background:rgb(15 23 42 / .5);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px;backdrop-filter:blur(2px)}
.modal.hidden{display:none}
.modal .box{background:#fff;border-radius:20px;padding:28px;max-width:440px;width:100%;box-shadow:var(--sh-lg);position:relative;max-height:92vh;overflow:auto}
.modal .mq{font-size:17px;font-weight:800;line-height:1.5;margin-bottom:6px}
.modal .msub{font-size:12.5px;color:var(--text-muted);margin-bottom:22px;line-height:1.6}
.modal .btns{display:flex;gap:10px}
.modal .btns button{flex:1;padding:13px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;border:1px solid var(--border);font-family:inherit;transition:.15s}
.modal .yes{background:var(--primary);color:#fff;border-color:var(--primary)}
.modal .yes:hover{background:var(--primary-hover)}
.modal .no{background:#fff;color:var(--text-sub)}
.applysum{background:#F8FAFC;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.applysum .r{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.applysum .r .k{color:var(--text-sub)}.applysum .r .v{font-weight:700}
.applysum .r.hl .v{color:var(--primary);font-size:16px;font-weight:800}
.applyform{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.applyform input[type=text],.applyform input:not([type]){padding:12px 14px;border:1px solid var(--border);border-radius:11px;font-size:13.5px;font-family:inherit;width:100%}
.applyform input:focus{outline:none;border-color:var(--border-focus);box-shadow:0 0 0 3px rgb(59 130 246 / .12)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-sub);cursor:pointer;padding:2px}
.chk input{width:17px;height:17px;accent-color:var(--primary)}
.mtitle{font-size:18px;font-weight:800;margin-bottom:4px}
.mclose{position:absolute;top:20px;right:22px;border:none;background:transparent;font-size:24px;color:var(--text-muted);cursor:pointer;line-height:1}
.okmsg{text-align:center;padding:10px 0}
.okmsg .ic{font-size:44px;margin-bottom:10px}
.warn{font-size:11.5px;color:var(--gold);background:var(--gold-subtle);border-radius:8px;padding:8px 10px;margin-bottom:14px}
@media(max-width:768px){
 .wrap{grid-template-columns:1fr;grid-template-areas:"f" "match" "main";padding:12px;gap:12px}
 header.top{padding:14px 16px}header.top .sp{display:none}
 .filters{position:static}.ftoggle{display:block}.filters.collapsed .fbody{display:none}
 .matchbar{position:static}.stocklist{max-height:60vh}
 .herobar{grid-template-columns:1fr;gap:12px}
 .pgrid{margin:0 -12px;padding-left:12px;padding-right:12px;scroll-snap-type:x mandatory}
 .pgrid>.pcard{flex:0 0 min(82vw,330px)}
 .price .amt{font-size:27px}
}

function 사용가능(v,p){
  if(p==="동반차(구입형)"&&v.구분==="중고")return false;   /* 구입형렌트는 재렌트(중고) 불가 */

  return 파일상품(v,p)!=null;                               /* 그 외: 렌트료관리 파일에 값이 있어야 노출 */

function renderProducts(v){

    var cards=list.filter(p=>사용가능(v,p)).map(p=>상품카드(v,p,budget)).filter(Boolean);
    cards.sort((a,b)=>a.sortKey-b.sortKey);
    if(!cards.length)return {html:"",fit:0};
    return {html:'<div class="pgroup"><h4><span class="b '+cls+'">'+title+'</span> 상품 '+cards.length+'개</h4><div class="pgrid">'+cards.map(c=>c.html).join("")+'</div></div>',fit:cards.filter(c=>c.fits).length};
  }

  if(형태==="리스"||형태==="전체")groups.push(grp("리스","lease",리스상품));
  var body=groups.map(x=>x.html).join("");

    var 렌트가능=렌트상품.some(p=>사용가능(v,p)), 리스가능=리스상품.some(p=>사용가능(v,p));

    else body='<div class="empty">이 차량은 현재 안내 가능한 상품이 없어요.<br>찾으시는 조건이 있다면 <span class="inqlink" onclick="openInq()">문의하기</span>로 남겨주세요.</div>';

      :'<div class="recbanner soft">월 '+(+byId("budget").value).toLocaleString()+'만원에 맞추려면 상단 개월수를 늘려 월 납입료를 낮춰 보세요.</div>';
  }
  var note='<div class="note">동반차·6&12·월렌트·믿음카·동반차리스 등은 렌트료관리 파일 기준입니다. 구입형렌트·구입형리스는 실제 계산식으로 보증금/선수금 선택 시 월 납입료가 즉시 재계산되며 만기 인수금액을 함께 표기합니다.</div>';
  byId("products").innerHTML=banner+body+note;
}
